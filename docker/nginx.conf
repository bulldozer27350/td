# ============================================================================
# nginx.conf — Configuration du reverse proxy Nginx
# ============================================================================
#
# Ce fichier configure Nginx pour :
#
# 1. Servir les fichiers statiques du jeu et du studio
# 2. Proxifier les appels API vers les services Java
#
# LEXIQUE :
#   proxy_pass    → URL vers laquelle Nginx redirige la requête
#   upstream      → groupe de serveurs derrière Nginx (permet le load balancing)
#   location      → bloc de règles applicables à un chemin URL particulier
#   try_files     → essaie plusieurs fichiers/chemins avant de répondre 404
#
# IMPORTANT : Dans docker-compose, les services se parlent par leur NOM
# (ex: "td-engine") et non par "localhost". Docker crée un réseau interne
# où chaque service est joignable par son nom déclaré dans docker-compose.yml.
# ============================================================================


# ── Définition des services backend (upstream) ────────────────────────────────
# Ces blocs définissent les adresses des services Java.
# Le nom après "upstream" est libre, il est utilisé dans les blocs "location".

upstream engine_backend {
    # "td-engine" = nom du service dans docker-compose.yml, port Spring Boot
    server td-engine:8080;
}

upstream progression_backend {
    server td-progression:8082;
}

upstream editor_backend {
    server td-level-editor:8081;
}


# ── Serveur principal ─────────────────────────────────────────────────────────
server {
    listen 80;
    server_name etourneau.ddns.net localhost;

    # Taille max des requêtes (utile pour l'éditeur qui envoie des JSON de niveaux)
    client_max_body_size 10M;

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log  warn;

    # ── En-têtes de sécurité HTTP ─────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;

    # =========================================================================
    # FICHIERS STATIQUES
    # =========================================================================

    # Route racine → redirige vers l'interface de jeu
    location = / {
        return 301 /jeu/;
    }

    # Redirection automatique si le slash est oublié (facilite l'accès depuis mobile)
    location = /jeu {
        return 301 /jeu/;
    }

    location /jeu/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /jeu/index.html;

        # Cache les assets statiques (JS, CSS, images) pendant 1 jour
        location ~* \.(js|css|png|jpg|gif|ico|svg|woff|woff2)$ {
            expires 1d;
            add_header Cache-Control "public, immutable";
        }
    }

    location = /administration {
        return 301 /administration/;
    }

    # Interface Administration / éditeur de niveaux
    location /administration/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /administration/index.html;
    }

    # =========================================================================
    # PROXY VERS LES SERVICES JAVA (API)
    # =========================================================================
    # Les blocs "proxy_set_header" transmettent des informations au service Java :
    # - Host           : le nom d'hôte original du client
    # - X-Real-IP      : l'adresse IP réelle du client (pas celle de Nginx)
    # - X-Forwarded-*  : en-têtes standards pour les reverse proxies

    # Moteur de jeu → td-engine-http (port 8080)
    location /api/engine/ {
        proxy_pass         http://engine_backend/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout plus long pour les opérations de jeu (ex: initialisation)
        proxy_read_timeout 30s;
    }

    # Service de progression → td-progression-http (port 8082)
    location /api/progression/ {
        proxy_pass         http://progression_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 15s;
    }

    # Éditeur de niveaux → td-level-editor-http (port 8081)
    location /api/editor/ {
        proxy_pass         http://editor_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout plus long pour la sauvegarde de niveaux complexes
        proxy_read_timeout 30s;
    }

    # ── Page d'erreur personnalisée ───────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
