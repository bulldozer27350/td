openapi: 3.0.3

info:
  title: Tower Defense Game Engine API
  description: Public HTTP API to interact with the Tower Defense game engine.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

paths:

  /game/initialize:
    post:
      summary: Initialize a new game with a full configuration
      operationId: initializeGame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameConfig'
      responses:
        '204':
          description: Game initialized successfully
        '400':
          description: Invalid game configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unknownTowerType:
                  summary: Unknown tower type
                  value:
                    errorCode: "INVALID_CONFIG"
                    message: "Invalid tower type configuration: Unknown tower type: laser"
                    status: 400
                    timestamp: "2026-01-10T14:30:00"
                    details:
                      configType: "tower type"
                      towerTypeId: "laser"
                unknownEnemyType:
                  summary: Unknown enemy type
                  value:
                    errorCode: "INVALID_CONFIG"
                    message: "Invalid enemy type configuration: Unknown enemy type: dragon"
                    status: 400
                    timestamp: "2026-01-10T14:30:00"
                    details:
                      configType: "enemy type"
                      enemyTypeId: "dragon"

  /game/state:
    get:
      summary: Get current game state
      operationId: getGameState
      responses:
        '200':
          description: Current game state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameState'
        '412':
          description: Game not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: "GAME_NOT_INITIALIZED"
                message: "Game has not been initialized"
                status: 412
                timestamp: "2026-01-10T14:30:00"
                details: {}

  /game/tick:
    post:
      summary: Advance the game by one tick
      operationId: tick
      responses:
        '204':
          description: Tick executed successfully
        '409':
          description: Cannot tick (game over)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: "GAME_OVER"
                message: "Cannot perform action: game is over"
                status: 409
                timestamp: "2026-01-10T14:30:00"
                details: {}

  /game/commands/place-tower:
    post:
      summary: Place a tower
      operationId: placeTower
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceTowerRequest'
      responses:
        '202':
          description: Command accepted and queued
        '400':
          description: Invalid command or unknown tower type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                insufficientGold:
                  summary: Not enough gold
                  value:
                    errorCode: "INSUFFICIENT_GOLD"
                    message: "Insufficient gold: required 100, available 50"
                    status: 400
                    timestamp: "2026-01-10T14:30:00"
                    details:
                      required: 100
                      available: 50
                unknownTowerType:
                  summary: Unknown tower type
                  value:
                    errorCode: "INVALID_CONFIG"
                    message: "Unknown tower type: laser"
                    status: 400
                    timestamp: "2026-01-10T14:30:00"
                    details:
                      towerTypeId: "laser"
        '409':
          description: Position occupied or game state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                positionOccupied:
                  summary: Position already occupied
                  value:
                    errorCode: "POSITION_OCCUPIED"
                    message: "Position (5, 5) is already occupied by tower abc-123"
                    status: 409
                    timestamp: "2026-01-10T14:30:00"
                    details:
                      x: 5
                      y: 5
                      existingTowerId: "abc-123"
                gameOver:
                  summary: Game is over
                  value:
                    errorCode: "GAME_OVER"
                    message: "Cannot perform action: game is over"
                    status: 409
                    timestamp: "2026-01-10T14:30:00"
                    details: {}

  /game/commands/upgrade-tower:
    post:
      summary: Upgrade a tower
      operationId: upgradeTower
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeTowerRequest'
      responses:
        '202':
          description: Command accepted and queued
        '400':
          description: Insufficient gold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: "INSUFFICIENT_GOLD"
                message: "Insufficient gold: required 200, available 150"
                status: 400
                timestamp: "2026-01-10T14:30:00"
                details:
                  required: 200
                  available: 150
        '404':
          description: Tower not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: "ENTITY_NOT_FOUND"
                message: "Tower with id abc-123 not found"
                status: 404
                timestamp: "2026-01-10T14:30:00"
                details:
                  entityType: "Tower"
                  entityId: "abc-123"
        '409':
          description: Tower cannot be upgraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                maxRank:
                  summary: Max rank reached
                  value:
                    errorCode: "TOWER_MAX_LEVEL"
                    message: "Tower abc-123 has reached max rank 3"
                    status: 409
                    timestamp: "2026-01-10T14:30:00"
                    details:
                      towerId: "abc-123"
                      currentLevel: 3
                underConstruction:
                  summary: Tower under construction
                  value:
                    errorCode: "TOWER_CANNOT_UPGRADE"
                    message: "Tower abc-123 cannot be upgraded: tower is currently under construction"
                    status: 409
                    timestamp: "2026-01-10T14:30:00"
                    details:
                      towerId: "abc-123"
                      reason: "tower is currently under construction"

  /game/commands/sell-tower:
    post:
      summary: Sell a tower
      operationId: sellTower
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellTowerRequest'
      responses:
        '202':
          description: Command accepted and queued
        '404':
          description: Tower not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: "ENTITY_NOT_FOUND"
                message: "Tower with id abc-123 not found"
                status: 404
                timestamp: "2026-01-10T14:30:00"
                details:
                  entityType: "Tower"
                  entityId: "abc-123"
        '409':
          description: Tower cannot be sold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: "TOWER_CANNOT_SELL"
                message: "Tower abc-123 cannot be sold: tower is currently under construction"
                status: 409
                timestamp: "2026-01-10T14:30:00"
                details:
                  towerId: "abc-123"
                  reason: "tower is currently under construction"

  /game/status:
    get:
      summary: Check if game is over
      operationId: getGameStatus
      responses:
        '200':
          description: Game status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStatus'

components:

  schemas:

    # ========================================================================
    # ERROR RESPONSE SCHEMA
    # ========================================================================
    
    ErrorResponse:
      type: object
      required:
        - errorCode
        - message
        - status
        - timestamp
        - details
      properties:
        errorCode:
          type: string
          description: Machine-readable error code for client handling
          enum:
            - INSUFFICIENT_GOLD
            - POSITION_OCCUPIED
            - TOWER_NOT_FOUND
            - ENTITY_NOT_FOUND
            - TOWER_CANNOT_UPGRADE
            - TOWER_CANNOT_SELL
            - TOWER_MAX_LEVEL
            - GAME_OVER
            - GAME_NOT_INITIALIZED
            - LEVEL_PROGRESS_NOT_INITIALIZED
            - INVALID_CONFIG
            - UNKNOWN_ENEMY_TYPE
            - UNKNOWN_TOWER_TYPE
            - UNKNOWN_PATH
            - UNAUTHORIZED_ACTION
            - INVALID_ARGUMENT
            - INVALID_STATE
            - INTERNAL_ERROR
          example: "INSUFFICIENT_GOLD"
        message:
          type: string
          description: Human-readable error message
          example: "Insufficient gold: required 100, available 50"
        status:
          type: integer
          description: HTTP status code
          example: 400
        timestamp:
          type: string
          format: date-time
          description: When the error occurred
          example: "2026-01-10T14:30:00"
        details:
          type: object
          description: Additional context-specific information
          additionalProperties: true
          example:
            required: 100
            available: 50

    # ========================================================================
    # CONFIGURATION SCHEMAS (unchanged)
    # ========================================================================

    GameConfig:
      type: object
      properties:
        levelConfig:
          $ref: '#/components/schemas/LevelConfig'
        towersConfig:
          $ref: '#/components/schemas/TowersConfig'
        enemiesConfig:
          $ref: '#/components/schemas/EnemiesConfig'
      required: [levelConfig, towersConfig, enemiesConfig]

    LevelConfig:
      type: object
      properties:
        id:
          type: string
        map:
          $ref: '#/components/schemas/MapDimensions'
        startingLives:
          type: integer
        startingMoney:
          type: integer
        attacks:
          type: array
          items:
            $ref: '#/components/schemas/AttackConfig'
        towerCapacities: 
          type: array
          items:
            $ref: '#/components/schemas/TowerCapacityConfig'
        paths:
          type: array
          items:
            $ref: '#/components/schemas/PathConfig'
      required: [id, startingLives, startingMoney, attacks, map, paths]

    MapDimensions:
      type: object
      properties:
        width:
          type: integer
        height:
          type: integer
      required: [width, height]

    TowerCapacityConfig: 
      type: object
      required:
        - towerTypeId
        - maxRank
      properties:
        towerTypeId:
          type: string
          example: "machinegun"
        maxRank:
          type: integer
          minimum: 1
          example: 3

    AttackConfig:
      type: object
      properties:
        id:
          type: string
        waves:
          type: array
          items:
            $ref: '#/components/schemas/WaveConfig'
      required: [id, waves]

    WaveConfig:
      type: object
      properties:
        id:
          type: string
        startTick:
          type: integer
        spawnInterval:
          type: integer
        count:
          type: integer
        enemyType:
          type: string
        pathId:
          type: string
      required: [id, startTick, spawnInterval, count, enemyType, pathId]

    PathConfig:
      type: object
      properties:
        id:
          type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/PointConfig'
      required: [id, points]

    PointConfig:
      type: object
      properties:
        x:
          type: integer
        y:
          type: integer
      required: [x, y]

    EnemiesConfig:
      type: object
      properties:
        enemies:
          type: array
          items:
            $ref: '#/components/schemas/EnemyTypeConfig'
      required: [enemies]

    EnemyTypeConfig:
      type: object
      properties:
        id:
          type: string
        hp:
          type: integer
        speed:
          type: number
          format: double
        bounty:
          type: integer
      required: [id, hp, speed, bounty]

    TowersConfig:
      type: object
      properties:
        towers:
          type: array
          items:
            $ref: '#/components/schemas/TowerTypeConfig'
      required: [towers]

    TowerTypeConfig:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        ranks:
          type: array
          items:
            $ref: '#/components/schemas/TowerRankConfig'
      required: [id, name, ranks]

    TowerRankConfig:
      type: object
      properties:
        rank:
          type: integer
        upgradeCost:
          type: integer
        sellValue:
          type: integer
        range:
          type: number
          format: double
        damage:
          type: integer
        reloadSeconds:
          type: number
          format: double
        buildTimeTicks:
          type: integer
      required:
        - rank
        - upgradeCost
        - sellValue
        - range
        - damage
        - reloadSeconds
        - buildTimeTicks

    GameStatus:
      type: object
      properties:
        gameOver:
          type: boolean
      required: [gameOver]

    # ========================================================================
    # RUNTIME STATE SCHEMAS
    # ========================================================================

    GameState:
      type: object
      properties:
        player:
          $ref: '#/components/schemas/LevelPlayer'
        towers:
          type: array
          items:
            $ref: '#/components/schemas/Tower'
        enemies:
          type: array
          items:
            $ref: '#/components/schemas/Enemy'
        projectiles:
          type: array
          items:
            $ref: '#/components/schemas/Projectile'
      required: [player, towers, enemies, projectiles]

    LevelPlayer:
      type: object
      properties:
        id:
          type: string
        currentGold:
          type: integer
        currentLives:
          type: integer
        progress:
          $ref: '#/components/schemas/LevelProgress'
      required: [id, currentGold, currentLives, progress]

    LevelProgress:
      type: object
      properties:
        levelIndex:
          type: string
        attackIndex:
          type: integer
      required: [levelIndex, attackIndex]

    Position:
      type: object
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
      required: [x, y]

    Tower:
      type: object
      properties:
        id:
          type: string
        position:
          $ref: '#/components/schemas/Position'
        towerType:
          type: string
          description: ID of the tower type (e.g., "machinegun", "shotgun")
        state:
          type: string
      required: [id, position, towerType, state]

    Enemy:
      type: object
      properties:
        id:
          type: string
        position:
          $ref: '#/components/schemas/Position'
        maxHp:
          type: integer
        currentHp:
          type: integer
        isAlive:
          type: boolean
      required: [id, position, maxHp, currentHp, isAlive]

    Projectile:
      type: object
      properties:
        id:
          type: string
        position:
          $ref: '#/components/schemas/Position'
      required: [id, position]

    # ========================================================================
    # COMMAND SCHEMAS
    # ========================================================================

    PlaceTowerRequest:
      type: object
      properties:
        playerId:
          type: string
        towerType:
          type: string
          description: ID of the tower type (e.g., "machinegun", "shotgun")
        x:
          type: integer
        y:
          type: integer
      required: [playerId, towerType, x, y]

    UpgradeTowerRequest:
      type: object
      properties:
        playerId:
          type: string
        towerXPosition:
          type: integer
        towerYPosition:
          type: integer
      required: [playerId, towerXPosition, towerYPosition]

    SellTowerRequest:
      type: object
      properties:
        playerId:
          type: string
        towerXPosition:
          type: integer
        towerYPosition:
          type: integer
      required: [playerId, towerXPosition, towerYPosition]