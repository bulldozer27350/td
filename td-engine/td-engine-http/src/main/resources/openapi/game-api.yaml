openapi: 3.0.3

info:
  title: Tower Defense Game Engine API
  description: Public HTTP API to interact with the Tower Defense game engine.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

paths:

  /game/initialize:
    post:
      summary: Initialize a new game with a full configuration
      operationId: initializeGame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameConfig'
      responses:
        '204':
          description: Game initialized
        '400':
          description: Invalid game configuration

  /game/state:
    get:
      summary: Get current game state
      operationId: getGameState
      responses:
        '200':
          description: Current game state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameState'

  /game/tick:
    post:
      summary: Advance the game by one tick
      operationId: tick
      responses:
        '204':
          description: Tick executed

  /game/commands/place-tower:
    post:
      summary: Place a tower
      operationId: placeTower
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceTowerRequest'
      responses:
        '202':
          description: Command accepted
        '400':
          description: Invalid command

  /game/commands/upgrade-tower:
    post:
      summary: Upgrade a tower
      operationId: upgradeTower
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeTowerRequest'
      responses:
        '202':
          description: Command accepted
        '400':
          description: Invalid command

  /game/commands/sell-tower:
    post:
      summary: Sell a tower
      operationId: sellTower
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellTowerRequest'
      responses:
        '202':
          description: Command accepted
        '400':
          description: Invalid command

  /game/status:
    get:
      summary: Check if game is over
      operationId: getGameStatus
      responses:
        '200':
          description: Game status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStatus'

components:

  schemas:

    GameConfig:
      type: object
      properties:
        levelConfig:
          $ref: '#/components/schemas/LevelConfig'
        pathsConfig:
          $ref: '#/components/schemas/PathsConfig'
        towersConfig:
          $ref: '#/components/schemas/TowersConfig'
        enemiesConfig:
          $ref: '#/components/schemas/EnemiesConfig'
      required: [levelConfig, pathsConfig, towersConfig, enemiesConfig]

    LevelConfig:
      type: object
      properties:
        id:
          type: string
        startingLives:
          type: integer
        startingMoney:
          type: integer
        attacks:
          type: array
          items:
            $ref: '#/components/schemas/AttackConfig'
      required: [id, startingLives, startingMoney, attacks]

    AttackConfig:
      type: object
      properties:
        id:
          type: string
        waves:
          type: array
          items:
            $ref: '#/components/schemas/WaveConfig'
      required: [id, waves]

    WaveConfig:
      type: object
      properties:
        id:
          type: string
        startTick:
          type: integer
        spawnInterval:
          type: integer
        count:
          type: integer
        enemyType:
          type: string
        pathId:
          type: string
      required: [id, startTick, spawnInterval, count, enemyType, pathId]

    PathsConfig:
      type: object
      properties:
        paths:
          type: array
          items:
            $ref: '#/components/schemas/PathConfig'
      required: [paths]

    PathConfig:
      type: object
      properties:
        id:
          type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/PointConfig'
      required: [id, points]

    PointConfig:
      type: object
      properties:
        x:
          type: integer
        y:
          type: integer
      required: [x, y]

    EnemiesConfig:
      type: object
      properties:
        enemies:
          type: array
          items:
            $ref: '#/components/schemas/EnemyTypeConfig'
      required: [enemies]

    EnemyTypeConfig:
      type: object
      properties:
        id:
          type: string
        hp:
          type: integer
        speed:
          type: number
          format: double
        bounty:
          type: integer
      required: [id, hp, speed, bounty]

    TowersConfig:
      type: object
      properties:
        towers:
          type: array
          items:
            $ref: '#/components/schemas/TowerTypeConfig'
      required: [towers]

    TowerTypeConfig:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        levels:
          type: array
          items:
            $ref: '#/components/schemas/TowerLevelConfig'
      required: [id, name, levels]

    TowerLevelConfig:
      type: object
      properties:
        level:
          type: integer
        upgradeCost:
          type: integer
        sellValue:
          type: integer
        range:
          type: number
          format: double
        damage:
          type: integer
        reloadSeconds:
          type: number
          format: double
        buildTimeTicks:
          type: integer
      required:
        - level
        - upgradeCost
        - sellValue
        - range
        - damage
        - reloadSeconds
        - buildTimeTicks

    GameStatus:
      type: object
      properties:
        gameOver:
          type: boolean
      required: [gameOver]

    # ---- Existing runtime view objects (unchanged) ----

    GameState:
      type: object
      properties:
        player:
          $ref: '#/components/schemas/LevelPlayer'
        towers:
          type: array
          items:
            $ref: '#/components/schemas/Tower'
        enemies:
          type: array
          items:
            $ref: '#/components/schemas/Enemy'
        projectiles:
          type: array
          items:
            $ref: '#/components/schemas/Projectile'
      required: [player, towers, enemies, projectiles]

    LevelPlayer:
      type: object
      properties:
        id:
          type: string
        currentGold:
          type: integer
        currentLives:
          type: integer
        progress:
          $ref: '#/components/schemas/LevelProgress'
      required: [id, currentGold, currentLives, progress]

    LevelProgress:
      type: object
      properties:
        levelIndex:
          type: string
        attackIndex:
          type: integer
      required: [levelIndex, attackIndex]

    Position:
      type: object
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
      required: [x, y]

    Tower:
      type: object
      properties:
        id:
          type: string
        position:
          $ref: '#/components/schemas/Position'
        towerType:
          type: string
        state:
          type: string
      required: [id, position, towerType, state]

    Enemy:
      type: object
      properties:
        id:
          type: string
        position:
          $ref: '#/components/schemas/Position'
        maxHp:
          type: integer
        currentHp:
          type: integer
        isAlive:
          type: boolean
      required: [id, position, maxHp, currentHp, isAlive]

    Projectile:
      type: object
      properties:
        id:
          type: string
        position:
          $ref: '#/components/schemas/Position'
      required: [id, position]

    PlaceTowerRequest:
      type: object
      properties:
        playerId:
          type: string
        towerType:
          type: string
        x:
          type: integer
        y:
          type: integer
      required: [playerId, towerType, x, y]

    UpgradeTowerRequest:
      type: object
      properties:
        playerId:
          type: string
        towerXPosition:
          type: integer
        towerYPosition:
          type: integer
      required: [playerId, towerXPosition, towerYPosition]

    SellTowerRequest:
      type: object
      properties:
        playerId:
          type: string
        towerXPosition:
          type: integer
        towerYPosition:
          type: integer
      required: [playerId, towerXPosition, towerYPosition]
