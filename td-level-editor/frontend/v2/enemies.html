<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Defense Studio - Ennemis</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-600 text-white p-4 shadow-lg">
        <div class="container mx-auto flex gap-6">
            <div>
                <h1 class="text-2xl font-bold"><a href="index.html" class="hover:underline">🏠 Accueil</a></h1>
            </div>
            <div>
                <h1 class="text-2xl font-bold">🏗️ TD Studio</h1>
                <p class="text-sm text-blue-200"></p>
                <a href="levels.html" class="hover:underline">🗺️ Niveaux</a>
                <a href="enemies.html" class="font-bold underline">👾 Ennemis</a>
                <a href="towers.html" class="hover:underline">🗼 Tours</a>
            </div>

            <div><h1 class="text-2xl font-bold"><a href="td-progression.html">
                ⭐ Progression
            </a> </h1></div>
        </div>
    </nav>

    <div class="container mx-auto p-6">
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <h1 class="text-3xl font-bold mb-6 text-gray-800">👾 Gestion des Types d'Ennemis</h1>
            
            <!-- Formulaire de création -->
            <div class="mb-6 p-6 bg-gradient-to-r from-red-50 to-orange-50 rounded-lg border border-red-200">
                <h2 class="text-lg font-semibold mb-4 text-gray-700">✨ Créer un nouveau type d'ennemi</h2>
                <form id="createForm" class="grid md:grid-cols-5 gap-3">
                    <input type="text" id="enemyId" placeholder="ID (ex: goblin)" 
                           class="border rounded px-4 py-2 focus:ring-2 focus:ring-red-500 outline-none" required>
                    <input type="number" id="health" placeholder="❤️ PV" min="1" value=""
                           class="border rounded px-4 py-2 focus:ring-2 focus:ring-red-500 outline-none" required>
                    <input type="number" id="speed" placeholder="⚡ Vitesse" min="0.1" step="0.1" value=""
                           class="border rounded px-4 py-2 focus:ring-2 focus:ring-red-500 outline-none" required>
                    <input type="number" id="reward" placeholder="💰 Récompense" min="0" value=""
                           class="border rounded px-4 py-2 focus:ring-2 focus:ring-red-500 outline-none" required>
                    <button type="submit" 
                            class="bg-red-500 text-white px-6 py-2 rounded hover:bg-red-600 transition-colors font-semibold shadow">
                        Créer
                    </button>
                </form>
            </div>

            <!-- Filtres et recherche -->
            <div class="mb-4 flex gap-3">
                <input type="text" id="searchInput" placeholder="🔍 Rechercher un ennemi..." 
                       class="flex-1 border rounded px-4 py-2 focus:ring-2 focus:ring-red-500 outline-none">
                <button onclick="showImportModal()" 
                        class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 transition-colors">
                    📥 Importer
                </button>
                <button onclick="loadEnemies()" 
                        class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 transition-colors">
                    🔄 Actualiser
                </button>
            </div>

            <!-- Tableau des ennemis -->
            <div class="overflow-x-auto">
                <table class="w-full border-collapse" id="enemiesTable">
                    <thead>
                        <tr class="bg-gray-100 border-b-2 border-gray-300">
                            <th class="p-3 text-left font-semibold">ID</th>
                            <th class="p-3 text-center font-semibold">❤️ PV</th>
                            <th class="p-3 text-center font-semibold">⚡ Vitesse</th>
                            <th class="p-3 text-center font-semibold">💰 Récompense</th>
                            <th class="p-3 text-center font-semibold">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="enemiesList">
                        <tr>
                            <td colspan="5" class="text-center py-8 text-gray-500">
                                <div class="animate-pulse">Chargement...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Statistiques -->
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-xl font-bold mb-4 text-gray-800">📊 Statistiques</h2>
            <div class="grid md:grid-cols-4 gap-4" id="statsContainer">
                <div class="bg-red-50 p-4 rounded-lg text-center">
                    <div class="text-3xl font-bold text-red-600" id="totalCount">-</div>
                    <div class="text-gray-600 text-sm mt-1">Total</div>
                </div>
                <div class="bg-green-50 p-4 rounded-lg text-center">
                    <div class="text-3xl font-bold text-green-600" id="avgHealth">-</div>
                    <div class="text-gray-600 text-sm mt-1">PV moyen</div>
                </div>
                <div class="bg-blue-50 p-4 rounded-lg text-center">
                    <div class="text-3xl font-bold text-blue-600" id="avgSpeed">-</div>
                    <div class="text-gray-600 text-sm mt-1">Vitesse moy.</div>
                </div>
                <div class="bg-yellow-50 p-4 rounded-lg text-center">
                    <div class="text-3xl font-bold text-yellow-600" id="avgReward">-</div>
                    <div class="text-gray-600 text-sm mt-1">Récompense moy.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal d'édition (existant) -->
    <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4">
            <h3 class="text-xl font-bold mb-4">✏️ Modifier un ennemi</h3>
            <form id="editForm" class="space-y-4">
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-sm font-medium mb-1">Points de vie</label>
                    <input type="number" id="editHealth" class="w-full border rounded px-3 py-2" min="1" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Vitesse</label>
                    <input type="number" id="editSpeed" class="w-full border rounded px-3 py-2" min="0.1" step="0.1" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Récompense</label>
                    <input type="number" id="editReward" class="w-full border rounded px-3 py-2" min="0" required>
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="closeEditModal()" 
                            class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">
                        Annuler
                    </button>
                    <button type="submit" 
                            class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                        Sauvegarder
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal d'import/export (nouveau) -->
    <div id="importExportModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4">
            <h3 class="text-xl font-bold mb-4" id="importExportModalTitle">Import/Export</h3>
            <div id="modalContent"></div>
            <div class="mt-4 flex justify-end gap-2">
                <button onclick="closeImportExportModal()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">
                    Annuler
                </button>
                <button id="modalConfirmBtn" onclick="confirmModalAction()" 
                        class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                    Confirmer
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8081/api';
        let allEnemies = [];
        let currentModalAction = null;
        let currentEnemyId = null;
        const IMPORT_BASE_PATHS = {
            draft: 'D:\\\\Depots\\\\tower_defense\\\\drafts\\\\enemies\\\\',
            exportable: 'D:\\\\Depots\\\\tower_defense\\\\exportables\\\\enemies\\\\'
        };

        // ========================================
        // FONCTIONS D'IMPORT/EXPORT
        // ========================================

        function showImportModal() {
            document.getElementById('importExportModalTitle').textContent = '📥 Importer un type d\'ennemi';
            document.getElementById('modalContent').innerHTML = `
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-2">Type d'import</label>
                        <select id="importType" class="w-full border rounded px-3 py-2">
                            <option value="draft">Format Draft (éditable)</option>
                            <option value="exportable">Format Exportable (moteur)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Chemin du fichier</label>
                        <input
                            type="text"
                            id="importPath"
                            class="w-full border rounded px-3 py-2"
                        >
                    </div>
                </div>
            `;
            currentModalAction = 'import';
            document.getElementById('importExportModal').classList.remove('hidden');

            // --- LOGIQUE DYNAMIQUE ---
            const importTypeSelect = document.getElementById('importType');
            const importPathInput = document.getElementById('importPath');

            function updateImportPath() {
                const type = importTypeSelect.value;
                importPathInput.value = IMPORT_BASE_PATHS[type];
            }

            importTypeSelect.addEventListener('change', updateImportPath);

            // Initialisation
            updateImportPath();
        }

        function showExportModal(enemyId) {
            currentEnemyId = enemyId;
            document.getElementById('importExportModalTitle').textContent = '📤 Exporter le type d\'ennemi';
            document.getElementById('modalContent').innerHTML = `
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-2">Type d'export</label>
                        <select id="exportType" class="w-full border rounded px-3 py-2">
                            <option value="draft">Format Draft (éditable)</option>
                            <option value="exportable">Format Exportable (moteur)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Chemin de destination</label>
                        <input
                            type="text"
                            id="exportPath"
                            class="w-full border rounded px-3 py-2"
                        >
                    </div>
                </div>
            `;
            currentModalAction = 'export';
            document.getElementById('importExportModal').classList.remove('hidden');

            const exportTypeSelect = document.getElementById('exportType');
            const exportPathInput = document.getElementById('exportPath');

            function updateExportPath() {
                const type = exportTypeSelect.value;
                exportPathInput.value =
                    IMPORT_BASE_PATHS[type] + `${enemyId}.json`;
            }

            exportTypeSelect.addEventListener('change', updateExportPath);

            updateExportPath();
        }

        async function confirmModalAction() {
            if (currentModalAction === 'import') {
                await handleImport();
            } else if (currentModalAction === 'export') {
                await handleExport();
            }
        }

        async function handleImport() {
            const type = document.getElementById('importType').value;
            const path = document.getElementById('importPath').value;
            
            if (!path) {
                showNotification('❌ Veuillez saisir un chemin', 'error');
                return;
            }

            try {
                const endpoint = type === 'draft' 
                    ? `${API_URL}/enemies/import/draft`
                    : `${API_URL}/enemies/import/exportable`;
                
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path })
                });

                if (response.ok) {
                    showNotification('✅ Ennemi importé avec succès', 'success');
                    closeImportExportModal();
                    await loadEnemies();
                } else {
                    const error = await response.text();
                    showNotification('❌ Erreur d\'import: ' + error, 'error');
                }
            } catch (error) {
                showNotification('❌ Erreur de connexion', 'error');
                console.error(error);
            }
        }

        async function handleExport() {
            const type = document.getElementById('exportType').value;
            const path = document.getElementById('exportPath').value;
            
            if (!path) {
                showNotification('❌ Veuillez saisir un chemin', 'error');
                return;
            }

            try {
                const endpoint = type === 'draft'
                    ? `${API_URL}/enemies/${currentEnemyId}/export/draft`
                    : `${API_URL}/enemies/${currentEnemyId}/export/exportable`;
                
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path })
                });

                if (response.ok) {
                    showNotification('✅ Ennemi exporté avec succès', 'success');
                    closeImportExportModal();
                } else {
                    const error = await response.text();
                    showNotification('❌ Erreur d\'export: ' + error, 'error');
                }
            } catch (error) {
                showNotification('❌ Erreur de connexion', 'error');
                console.error(error);
            }
        }

        function closeImportExportModal() {
            document.getElementById('importExportModal').classList.add('hidden');
        }

        // ========================================
        // FONCTIONS DE GESTION DES ENNEMIS
        // ========================================

        // Charger les ennemis
        async function loadEnemies() {
            try {
                const response = await fetch(`${API_URL}/enemies`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                allEnemies = await response.json();
                displayEnemies(allEnemies);
                updateStats(allEnemies);
            } catch (error) {
                document.getElementById('enemiesList').innerHTML = 
                    `<tr><td colspan="5" class="text-center py-8">
                        <div class="text-red-500 text-lg mb-2">⚠️ Erreur de connexion</div>
                        <div class="text-gray-600 text-sm">Vérifiez que le serveur est démarré</div>
                    </td></tr>`;
                console.error('Erreur:', error);
            }
        }

        // Afficher les ennemis
        function displayEnemies(enemies) {
            const tbody = document.getElementById('enemiesList');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = enemies.filter(e => e.id.toLowerCase().includes(searchTerm));

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="5" class="text-center py-12 text-gray-500">
                        <div class="text-6xl mb-4">👾</div>
                        <div class="text-lg">Aucun ennemi trouvé</div>
                    </td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(enemy => `
                <tr class="border-b hover:bg-gray-50 transition-colors">
                    <td class="p-3">
                        <div class="font-semibold text-gray-800">${enemy.id}</div>
                    </td>
                    <td class="p-3 text-center">
                        <span class="inline-block bg-red-100 text-red-700 px-3 py-1 rounded-full font-semibold">
                            ${enemy.health}
                        </span>
                    </td>
                    <td class="p-3 text-center">
                        <span class="inline-block bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-semibold">
                            ${enemy.speed.toFixed(2)}
                        </span>
                    </td>
                    <td class="p-3 text-center">
                        <span class="inline-block bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full font-semibold">
                            ${enemy.reward}
                        </span>
                    </td>
                    <td class="p-3 text-center">
                        <div class="flex justify-center gap-2">
                            <button onclick='editEnemy(${JSON.stringify(enemy)})' 
                                    class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600 text-sm">
                                ✏️ Éditer
                            </button>
                            <button onclick="showExportModal('${enemy.id}')" 
                                    class="bg-purple-500 text-white px-3 py-1 rounded hover:bg-purple-600 text-sm">
                                📤
                            </button>
                            <button onclick="deleteEnemy('${enemy.id}')" 
                                    class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 text-sm">
                                🗑️
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // Mettre à jour les statistiques
        function updateStats(enemies) {
            document.getElementById('totalCount').textContent = enemies.length;
            
            if (enemies.length > 0) {
                const avgHealth = Math.round(enemies.reduce((sum, e) => sum + e.health, 0) / enemies.length);
                const avgSpeed = (enemies.reduce((sum, e) => sum + e.speed, 0) / enemies.length).toFixed(2);
                const avgReward = Math.round(enemies.reduce((sum, e) => sum + e.reward, 0) / enemies.length);
                
                document.getElementById('avgHealth').textContent = avgHealth;
                document.getElementById('avgSpeed').textContent = avgSpeed;
                document.getElementById('avgReward').textContent = avgReward;
            } else {
                document.getElementById('avgHealth').textContent = '-';
                document.getElementById('avgSpeed').textContent = '-';
                document.getElementById('avgReward').textContent = '-';
            }
        }

        // Recherche en temps réel
        document.getElementById('searchInput').addEventListener('input', () => {
            displayEnemies(allEnemies);
        });

        // Créer un ennemi
        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            btn.textContent = 'Création...';
            btn.disabled = true;

            const data = {
                id: document.getElementById('enemyId').value,
                health: parseInt(document.getElementById('health').value),
                speed: parseFloat(document.getElementById('speed').value),
                reward: parseInt(document.getElementById('reward').value)
            };

            try {
                const response = await fetch(`${API_URL}/enemies`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    e.target.reset();
                    await loadEnemies();
                    showNotification('✅ Ennemi créé avec succès !', 'success');
                } else {
                    const error = await response.text();
                    showNotification('❌ Erreur: ' + error, 'error');
                }
            } catch (error) {
                showNotification('❌ Erreur de connexion', 'error');
                console.error(error);
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });

        // Éditer un ennemi
        function editEnemy(enemy) {
            document.getElementById('editId').value = enemy.id;
            document.getElementById('editHealth').value = enemy.health;
            document.getElementById('editSpeed').value = enemy.speed;
            document.getElementById('editReward').value = enemy.reward;
            document.getElementById('editModal').classList.remove('hidden');
        }

        // Note: L'API actuelle ne permet pas de modifier un ennemi existant
        // Cette fonction est préparée pour une future implémentation
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            showNotification('⚠️ La modification n\'est pas encore implémentée dans l\'API', 'info');
            closeEditModal();
        });

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        // Supprimer un ennemi
        async function deleteEnemy(enemyId) {
            if (!confirm(`⚠️ Supprimer définitivement l'ennemi "${enemyId}" ?`)) return;

            try {
                const response = await fetch(`${API_URL}/enemies/${enemyId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showNotification('✅ Ennemi supprimé', 'success');
                    await loadEnemies();
                } else {
                    showNotification('❌ Erreur lors de la suppression', 'error');
                }
            } catch (error) {
                showNotification('❌ Erreur de connexion', 'error');
                console.error(error);
            }
        }

        // Système de notifications
        function showNotification(message, type = 'info') {
            const colors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                info: 'bg-blue-500'
            };

            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 ${colors[type]} text-white px-6 py-3 rounded-lg shadow-lg z-50`;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => notification.remove(), 3000);
        }

        // Charger au démarrage
        loadEnemies();
    </script>
</body>
</html>
