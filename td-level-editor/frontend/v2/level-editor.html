<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Éditeur de Niveau</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-blue-600 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <a href="levels.html" class="hover:underline flex items-center gap-2">
                ← Retour aux niveaux
            </a>
            <div class="font-bold text-lg" id="levelTitle">Chargement...</div>
        </div>
    </nav>

    <div class="container mx-auto p-6">
        <div class="grid grid-cols-4 gap-6">
            <!-- Panneau gauche : Propriétés et Actions -->
            <div class="space-y-6">
                <!-- Propriétés du niveau -->
                <div class="bg-white rounded-lg shadow-lg p-4">
                    <h2 class="text-xl font-bold mb-4 text-gray-800">⚙️ Propriétés</h2>
                    
                    <div id="levelInfo" class="mb-4 text-sm text-gray-600">
                        <div class="text-gray-500">Chargement...</div>
                    </div>

                    <form id="metadataForm" class="space-y-3">
                        <div>
                            <label class="block text-sm font-medium mb-1 text-gray-700">💰 Argent initial</label>
                            <input type="number" id="startingMoney" 
                                   class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none" min="0">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1 text-gray-700">❤️ Vies initiales</label>
                            <input type="number" id="startingLives" 
                                   class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none" min="1">
                        </div>
                        <button type="submit" 
                                class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600 transition-colors font-semibold">
                            💾 Sauvegarder
                        </button>
                        <button onclick="analyzeLevel()" 
                                class="w-full bg-purple-500 text-white py-2 rounded hover:bg-purple-600">
                            🔍 Analyser la difficulté
                        </button>
                    </form>
                </div>

                <!-- Actions rapides -->
                <div class="bg-white rounded-lg shadow-lg p-4">
                    <h3 class="font-bold mb-3 text-gray-800">🚀 Actions</h3>
                    <div class="space-y-2">
                        <button id="togglePathCreationBtn" onclick="togglePathCreation()" 
                                class="w-full bg-yellow-500 text-white py-2 rounded hover:bg-yellow-600 transition-colors text-sm font-medium">
                            🖱️ Créer un chemin (clic)
                        </button>
                        <button onclick="showAddPathModal()" 
                                class="w-full bg-yellow-500 text-white py-2 rounded hover:bg-yellow-600 transition-colors text-sm font-medium">
                            ⌨️ Ajouter un chemin (texte)
                        </button>
                        <button onclick="showAddAttackModal()" 
                                class="w-full bg-purple-500 text-white py-2 rounded hover:bg-purple-600 transition-colors text-sm font-medium">
                            ⚔️ Ajouter une attaque
                        </button>
                        <button onclick="showAddTowerModal()" 
                                class="w-full bg-green-500 text-white py-2 rounded hover:bg-green-600 transition-colors text-sm font-medium">
                            🗼 Ajouter une tour
                        </button>
                    </div>
                    
                    <!-- Zone de création de chemin (cachée par défaut) -->
                    <div id="pathCreationPanel" class="hidden mt-4 p-3 bg-yellow-50 rounded-lg border-2 border-yellow-400">
                        <h4 class="font-semibold text-sm mb-2 text-yellow-800">🖱️ Mode création de chemin</h4>
                        <div class="space-y-2">
                            <input type="text" id="newPathId" placeholder="ID du chemin (ex: path-1)" 
                                class="w-full border rounded px-3 py-2 text-sm focus:ring-2 focus:ring-yellow-500 outline-none">
                            <div class="text-xs text-gray-600 mb-2">
                                Points: <span id="pathPointsCount" class="font-bold">0</span>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="validatePath()" 
                                        class="flex-1 bg-green-500 text-white py-2 rounded hover:bg-green-600 text-sm font-medium">
                                    ✅ Valider
                                </button>
                                <button onclick="cancelPathCreation()" 
                                        class="flex-1 bg-red-500 text-white py-2 rounded hover:bg-red-600 text-sm font-medium">
                                    ❌ Annuler
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Panneau central : Grille (2 colonnes) -->
            <div class="col-span-2 bg-white rounded-lg shadow-lg p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-gray-800">🗺️ Carte du niveau</h2>
                    <div class="text-sm text-gray-600">
                        <span id="gridSize">-</span>
                    </div>
                </div>
                <div class="border-2 border-gray-300 rounded-lg overflow-auto bg-gray-50" style="max-height: 600px;">
                    <div id="gridContainer" class="p-4" style="cursor: default;">
                        <!-- Grille générée dynamiquement -->
                    </div>
                </div>
                <div class="mt-4 text-sm text-gray-600 bg-blue-50 p-3 rounded">
                    <div class="font-medium mb-1">Légende:</div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>🟢 <span class="font-medium">I</span> = Entrée</div>
                        <div>🔴 <span class="font-medium">O</span> = Sortie</div>
                        <div>🟡 <span class="font-medium">→</span> = Chemin</div>
                        <div>⚪ <span class="font-medium">.</span> = Vide</div>
                    </div>
                </div>
            </div>

            <!-- Panneau droit : Détails -->
            <div class="space-y-6">
                <!-- Chemins -->
                <div class="bg-white rounded-lg shadow-lg p-4">
                    <h3 class="font-bold mb-3 text-gray-800">🛤️ Chemins</h3>
                    <div id="pathsList" class="space-y-2 max-h-48 overflow-y-auto">
                        <div class="text-gray-500 text-sm">Aucun chemin</div>
                    </div>
                </div>

                <!-- Attaques -->
                <div class="bg-white rounded-lg shadow-lg p-4">
                    <h3 class="font-bold mb-3 text-gray-800">⚔️ Attaques</h3>
                    <div id="attacksList" class="space-y-2 max-h-48 overflow-y-auto">
                        <div class="text-gray-500 text-sm">Aucune attaque</div>
                    </div>
                </div>

                <!-- Tours disponibles -->
                <div class="bg-white rounded-lg shadow-lg p-4">
                    <h3 class="font-bold mb-3 text-gray-800">🗼 Tours</h3>
                    <div id="towersList" class="space-y-2 max-h-48 overflow-y-auto">
                        <div class="text-gray-500 text-sm">Aucune tour</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal universel -->
    <div id="modalOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
            <h3 class="text-xl font-bold mb-4" id="modalTitle">Modal</h3>
            <div id="modalContent"></div>
            <div class="mt-6 flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">
                    Annuler
                </button>
                <button id="modalConfirm" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                    Confirmer
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8081/api';
        const params = new URLSearchParams(window.location.search);
        const levelId = params.get('id');
        let currentLevel = null;
        
        // Variables pour la création de chemins
        let isCreatingPath = false;
        let currentPathPoints = [];

        // ========================================
        // GESTION DE LA CRÉATION DE CHEMIN PAR CLIC
        // ========================================

        function togglePathCreation() {
            isCreatingPath = !isCreatingPath;
            const btn = document.getElementById('togglePathCreationBtn');
            const panel = document.getElementById('pathCreationPanel');
            
            if (isCreatingPath) {
                // Activer le mode création
                btn.textContent = '🛑 Arrêter la création';
                btn.classList.remove('bg-yellow-500', 'hover:bg-yellow-600');
                btn.classList.add('bg-orange-500', 'hover:bg-orange-600');
                panel.classList.remove('hidden');
                currentPathPoints = [];
                updatePathPointsCount();
                showNotification('🖱️ Cliquez sur la grille pour créer un chemin', 'info');
            } else {
                // Désactiver le mode création
                resetPathCreation();
            }
            
            renderGrid();
        }

        function handleCellClick(x, y) {
            if (!isCreatingPath) {
                return; // Ne rien faire si on n'est pas en mode création
            }
            
            const newPoint = { x, y };
            
            // Vérifier si le point n'est pas déjà dans le chemin
            const isDuplicate = currentPathPoints.some(p => p.x === x && p.y === y);
            if (isDuplicate) {
                showNotification('⚠️ Ce point est déjà dans le chemin', 'error');
                return;
            }
            
            // Vérifier que le nouveau point est adjacent au dernier (sauf pour le premier point)
            if (currentPathPoints.length > 0) {
                const lastPoint = currentPathPoints[currentPathPoints.length - 1];
                const isAdjacent = 
                    (Math.abs(x - lastPoint.x) === 1 && y === lastPoint.y) || // Horizontal
                    (Math.abs(y - lastPoint.y) === 1 && x === lastPoint.x);   // Vertical
                
                if (!isAdjacent) {
                    showNotification('⚠️ Le point doit être adjacent au précédent', 'error');
                    return;
                }
            }
            
            // Ajouter le point
            currentPathPoints.push(newPoint);
            updatePathPointsCount();
            renderGrid();
            
            showNotification(`✅ Point ajouté: (${x}, ${y})`, 'success');
        }

        function updatePathPointsCount() {
            document.getElementById('pathPointsCount').textContent = currentPathPoints.length;
        }

        async function validatePath() {
            const pathId = document.getElementById('newPathId').value.trim();
            
            if (!pathId) {
                showNotification('❌ Veuillez saisir un ID pour le chemin', 'error');
                return;
            }
            
            if (currentPathPoints.length < 2) {
                showNotification('❌ Un chemin doit contenir au moins 2 points', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/levels/${levelId}/paths`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: pathId,
                        points: currentPathPoints
                    })
                });

                if (response.ok) {
                    showNotification('✅ Chemin créé avec succès !', 'success');
                    resetPathCreation();
                    await loadLevel();
                } else {
                    const error = await response.text();
                    showNotification('❌ Erreur: ' + error, 'error');
                }
            } catch (error) {
                showNotification('❌ Erreur de connexion', 'error');
                console.error(error);
            }
        }

        function cancelPathCreation() {
            if (currentPathPoints.length > 0) {
                if (!confirm('❌ Annuler la création du chemin en cours ?')) {
                    return;
                }
            }
            resetPathCreation();
        }

        function resetPathCreation() {
            isCreatingPath = false;
            currentPathPoints = [];
            
            const btn = document.getElementById('togglePathCreationBtn');
            btn.textContent = '🖱️ Créer un chemin (clic)';
            btn.classList.remove('bg-orange-500', 'hover:bg-orange-600');
            btn.classList.add('bg-yellow-500', 'hover:bg-yellow-600');
            
            document.getElementById('pathCreationPanel').classList.add('hidden');
            document.getElementById('newPathId').value = '';
            updatePathPointsCount();
            
            renderGrid();
        }

        // Charger le niveau
        async function loadLevel() {
            try {
                const response = await fetch(`${API_URL}/levels/${levelId}`);
                currentLevel = await response.json();
                displayLevel();
            } catch (error) {
                alert('⚠️ Erreur de chargement du niveau');
                console.error(error);
                window.location.href = 'levels.html';
            }
        }

        // Afficher le niveau
        function displayLevel() {
            if (!currentLevel) return;

            // Titre
            document.getElementById('levelTitle').textContent = `Édition: ${currentLevel.id}`;

            // Informations
            document.getElementById('levelInfo').innerHTML = `
                <div class="font-bold text-lg mb-1">${currentLevel.id}</div>
                <div class="text-sm">Taille: ${currentLevel.map.width}×${currentLevel.map.height}</div>
            `;
            document.getElementById('gridSize').textContent = `${currentLevel.map.width}×${currentLevel.map.height}`;

            // Métadonnées
            document.getElementById('startingMoney').value = currentLevel.startingMoney;
            document.getElementById('startingLives').value = currentLevel.startingLives;

            // Grille
            renderGrid();

            // Chemins
            displayPaths();

            // Attaques
            displayAttacks();

            // Tours
            displayTowers();
        }

        // Rendu de la grille
        function renderGrid() {
            const container = document.getElementById('gridContainer');
            const { width, height } = currentLevel.map;
            
            const cellSize = Math.max(20, Math.min(40, 600 / Math.max(width, height)));
            
            // Initialiser la grille
            const cells = Array(height).fill().map(() => Array(width).fill('.'));
            
            // Dessiner des lignes entre les points du chemin en cours
            if (isCreatingPath && currentPathPoints.length > 1) {
                for (let i = 0; i < currentPathPoints.length - 1; i++) {
                    const from = currentPathPoints[i];
                    const to = currentPathPoints[i + 1];
                    
                    // Déterminer la direction
                    let arrow = '';
                    if (to.x > from.x) arrow = '→';
                    else if (to.x < from.x) arrow = '←';
                    else if (to.y > from.y) arrow = '↓';
                    else if (to.y < from.y) arrow = '↑';
                    
                    // Marquer visuellement (déjà fait avec 'C')
                }
            }

            // Marquer les chemins
            currentLevel.paths.forEach((path) => {
                for (let i = 0; i < path.points.length - 1; i++) {
                    const from = path.points[i];
                    const to = path.points[i + 1];
                    drawPathSegment(cells, from, to);
                }
                
                // Marquer entrée et sortie
                if (path.points.length > 0) {
                    const start = path.points[0];
                    const end = path.points[path.points.length - 1];
                    cells[start.y][start.x] = 'I';
                    cells[end.y][end.x] = 'O';
                }
            });

            // Marquer les points du chemin en cours de création
            if (isCreatingPath && currentPathPoints.length > 0) {
                currentPathPoints.forEach((point, index) => {
                    if (index === 0) {
                        cells[point.y][point.x] = 'S'; // Start (temporaire)
                    } else {
                        cells[point.y][point.x] = 'C'; // Current path (temporaire)
                    }
                });
            }

            // Générer HTML
            let grid = `<div style="display: grid; 
                grid-template-columns: repeat(${width}, ${cellSize}px);
                gap: 1px; background: #ddd; width: fit-content;">`;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const cell = cells[y][x];
                    let color = '#fff';
                    let text = '';
                    let textColor = '#666';
                    let cursorStyle = isCreatingPath ? 'crosshair' : 'pointer';
                    
                    if (cell === 'I') { color = '#4ade80'; text = 'I'; textColor = '#000'; }
                    else if (cell === 'O') { color = '#f87171'; text = 'O'; textColor = '#000'; }
                    else if (cell === 'P') { color = '#fbbf24'; text = '→'; textColor = '#000'; }
                    else if (cell === 'S') { color = '#10b981'; text = '●'; textColor = '#fff'; } // Point de départ en cours
                    else if (cell === 'C') { color = '#fbbf24'; text = '●'; textColor = '#fff'; } // Chemin en cours
                    
                    grid += `<div 
                        data-x="${x}" 
                        data-y="${y}"
                        onclick="handleCellClick(${x}, ${y})"
                        style="width: ${cellSize}px; height: ${cellSize}px; 
                        background: ${color}; display: flex; align-items: center; 
                        justify-content: center; font-size: ${cellSize * 0.6}px; 
                        font-weight: bold; color: ${textColor}; cursor: ${cursorStyle};"
                        title="(${x}, ${y})">
                        ${text}
                    </div>`;
                }
            }

            grid += '</div>';
            container.innerHTML = grid;
        }

        // Dessiner un segment de chemin
        function drawPathSegment(cells, from, to) {
            if (from.x === to.x) {
                // Vertical
                const start = Math.min(from.y, to.y);
                const end = Math.max(from.y, to.y);
                for (let y = start; y <= end; y++) {
                    cells[y][from.x] = 'P';
                }
            } else if (from.y === to.y) {
                // Horizontal
                const start = Math.min(from.x, to.x);
                const end = Math.max(from.x, to.x);
                for (let x = start; x <= end; x++) {
                    cells[from.y][x] = 'P';
                }
            }
        }

        // Afficher les chemins
        function displayPaths() {
            const container = document.getElementById('pathsList');
            if (currentLevel.paths.length === 0) {
                container.innerHTML = '<div class="text-gray-500 text-sm">Aucun chemin</div>';
                return;
            }

            container.innerHTML = currentLevel.paths.map(path => `
                <div class="p-3 bg-yellow-50 rounded border border-yellow-200 group hover:bg-yellow-100 transition-colors">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <div class="font-medium text-sm">${path.id}</div>
                            <div class="text-xs text-gray-600">${path.points.length} points</div>
                        </div>
                        <button onclick="removePath('${path.id}')" 
                                class="text-red-500 hover:text-red-700 text-xs opacity-0 group-hover:opacity-100 transition-opacity">
                            🗑️
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Afficher les attaques
        function displayAttacks() {
            const container = document.getElementById('attacksList');
            if (currentLevel.attacks.length === 0) {
                container.innerHTML = '<div class="text-gray-500 text-sm">Aucune attaque</div>';
                return;
            }

            container.innerHTML = currentLevel.attacks.map(attack => `
                <div class="p-3 bg-purple-50 rounded border border-purple-200 group hover:bg-purple-100 transition-colors">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <div class="font-medium text-sm">${attack.id}</div>
                            <div class="text-xs text-gray-600">${attack.waves.length} vague(s)</div>
                        </div>
                        <div class="flex gap-1">
                            <button onclick="editAttack('${attack.id}')" 
                                    class="text-blue-500 hover:text-blue-700 text-xs opacity-0 group-hover:opacity-100 transition-opacity">
                                ✏️
                            </button>
                            <button onclick="removeAttack('${attack.id}')" 
                                    class="text-red-500 hover:text-red-700 text-xs opacity-0 group-hover:opacity-100 transition-opacity">
                                🗑️
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Afficher les tours
        function displayTowers() {
            const container = document.getElementById('towersList');
            if (!currentLevel.towerCapacityIds || currentLevel.towerCapacityIds.length === 0) {
                container.innerHTML = '<div class="text-gray-500 text-sm">Aucune tour</div>';
                return;
            }

            container.innerHTML = currentLevel.towerCapacityIds.map(id => `
                <div class="p-2 bg-green-50 rounded border border-green-200 flex justify-between items-center group hover:bg-green-100 transition-colors">
                    <span class="text-sm font-medium">${id}</span>
                    <button onclick="removeTower('${id}')" 
                            class="text-red-500 hover:text-red-700 text-xs opacity-0 group-hover:opacity-100 transition-opacity">
                        🗑️
                    </button>
                </div>
            `).join('');
        }

        // Sauvegarder les métadonnées
        document.getElementById('metadataForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                startingMoney: parseInt(document.getElementById('startingMoney').value),
                startingLives: parseInt(document.getElementById('startingLives').value)
            };

            try {
                const response = await fetch(`${API_URL}/levels/${levelId}/metadata`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showNotification('✅ Métadonnées sauvegardées !', 'success');
                    await loadLevel();
                } else {
                    showNotification('❌ Erreur de sauvegarde', 'error');
                }
            } catch (error) {
                showNotification('❌ Erreur de connexion', 'error');
                console.error(error);
            }
        });

        // Modal : Ajouter un chemin
        function showAddPathModal() {
            document.getElementById('modalTitle').textContent = '➕ Ajouter un chemin';
            document.getElementById('modalContent').innerHTML = `
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">ID du chemin</label>
                        <input type="text" id="pathId" class="w-full border rounded px-3 py-2" placeholder="path-1">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Points du chemin</label>
                        <textarea id="pathPoints" class="w-full border rounded px-3 py-2" rows="4" 
                                  placeholder="Format: x1,y1;x2,y2;x3,y3
Exemple: 0,5;10,5;10,10"></textarea>
                        <div class="text-xs text-gray-600 mt-1">
                            Séparez les points par des point-virgules (;) et les coordonnées par des virgules (,)
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('modalConfirm').onclick = addPath;
            showModal();
        }

        async function addPath() {
            const pathId = document.getElementById('pathId').value.trim();
            const pointsStr = document.getElementById('pathPoints').value.trim();
            
            if (!pathId || !pointsStr) {
                alert('Veuillez remplir tous les champs');
                return;
            }

            try {
                const points = pointsStr.split(';').map(p => {
                    const [x, y] = p.trim().split(',').map(Number);
                    return { x, y };
                });

                const response = await fetch(`${API_URL}/levels/${levelId}/paths`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: pathId, points })
                });

                if (response.ok) {
                    closeModal();
                    showNotification('✅ Chemin ajouté !', 'success');
                    await loadLevel();
                } else {
                    showNotification('❌ Erreur d\'ajout', 'error');
                }
            } catch (error) {
                showNotification('❌ Format invalide', 'error');
                console.error(error);
            }
        }

        // Modal : Ajouter une attaque
        function showAddAttackModal() {
            document.getElementById('modalTitle').textContent = '⚔️ Ajouter une attaque';
            document.getElementById('modalContent').innerHTML = `
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">ID de l'attaque</label>
                        <input type="text" id="attackId" class="w-full border rounded px-3 py-2" placeholder="attack-1">
                    </div>
                </div>
            `;
            
            document.getElementById('modalConfirm').onclick = addAttack;
            showModal();
        }

        async function addAttack() {
            const attackId = document.getElementById('attackId').value.trim();
            
            if (!attackId) {
                alert('Veuillez saisir un ID');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/levels/${levelId}/attacks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: attackId })
                });

                if (response.ok) {
                    closeModal();
                    showNotification('✅ Attaque ajoutée !', 'success');
                    await loadLevel();
                } else {
                    showNotification('❌ Erreur d\'ajout', 'error');
                }
            } catch (error) {
                showNotification('❌ Erreur de connexion', 'error');
                console.error(error);
            }
        }

        // Éditer une attaque (ajouter des vagues)
        async function editAttack(attackId) {
            // Charger les types d'ennemis et les chemins disponibles
            const [enemiesRes, pathsData] = await Promise.all([
                fetch(`${API_URL}/enemies`),
                Promise.resolve(currentLevel.paths)
            ]);
            const enemies = await enemiesRes.json();
            
            document.getElementById('modalTitle').textContent = `✏️ Gérer l'attaque: ${attackId}`;
            document.getElementById('modalContent').innerHTML = `
                <div class="space-y-4">
                    <h4 class="font-semibold">Ajouter une vague</h4>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-medium mb-1">ID vague</label>
                            <input type="text" id="waveId" class="w-full border rounded px-3 py-2" placeholder="wave-1">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Tick de départ</label>
                            <input type="number" id="startTick" class="w-full border rounded px-3 py-2" value="0">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Intervalle (ticks)</label>
                            <input type="number" id="spawnInterval" class="w-full border rounded px-3 py-2" value="30">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Nombre d'ennemis</label>
                            <input type="number" id="count" class="w-full border rounded px-3 py-2" value="5">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Type d'ennemi</label>
                            <select id="enemyType" class="w-full border rounded px-3 py-2">
                                ${enemies.map(e => `<option value="${e.id}">${e.id}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Chemin</label>
                            <select id="pathId" class="w-full border rounded px-3 py-2">
                                ${pathsData.map(p => `<option value="${p.id}">${p.id}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('modalConfirm').onclick = () => addWave(attackId);
            showModal();
        }

        async function addWave(attackId) {
            const wave = {
                id: document.getElementById('waveId').value,
                startTick: parseInt(document.getElementById('startTick').value),
                spawnInterval: parseInt(document.getElementById('spawnInterval').value),
                count: parseInt(document.getElementById('count').value),
                enemyType: document.getElementById('enemyType').value,
                pathId: document.getElementById('pathId').value
            };

            try {
                const response = await fetch(`${API_URL}/levels/${levelId}/attacks/${attackId}/waves`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(wave)
                });

                if (response.ok) {
                    closeModal();
                    showNotification('✅ Vague ajoutée !', 'success');
                    await loadLevel();
                } else {
                    showNotification('❌ Erreur d\'ajout', 'error');
                }
            } catch (error) {
                showNotification('❌ Erreur de connexion', 'error');
                console.error(error);
            }
        }

        async function showAddTowerModal() {
            const response = await fetch(`${API_URL}/towers`);
            const towers = await response.json();
            
            document.getElementById('modalTitle').textContent = '🗼 Ajouter une tour disponible';
            document.getElementById('modalContent').innerHTML = `
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Type de tour</label>
                        <select id="towerTypeId" class="w-full border rounded px-3 py-2">
                            ${towers.map(t => `
                                <option value="${t.id}">
                                    ${t.id} (${t.upgrades.length} rangs disponibles)
                                </option>
                            `).join('')}
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium mb-1">Rang maximum autorisé</label>
                        <input type="number" 
                            id="maxRank" 
                            min="1" 
                            value="1"
                            class="w-full border rounded px-3 py-2">
                        <p class="text-xs text-gray-500 mt-1">
                            Limite le rang auquel les joueurs peuvent améliorer cette tour
                        </p>
                    </div>
                </div>
            `;
            
            document.getElementById('modalConfirm').onclick = addTower;
            showModal();
        }

        async function addTower() {
            const towerTypeId = document.getElementById('towerTypeId').value;
            const maxRank = parseInt(document.getElementById('maxRank').value);

            try {
                const response = await fetch(`${API_URL}/levels/${levelId}/tower-types`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        towerTypeId,
                        maxRank
                    })
                });

                if (response.ok) {
                    closeModal();
                    showNotification('✅ Tour ajoutée !', 'success');
                    await loadLevel();
                } else {
                    showNotification('❌ Erreur d\'ajout', 'error');
                }
            } catch (error) {
                showNotification('❌ Erreur de connexion', 'error');
                console.error(error);
            }
        }

        function displayTowers() {
            const container = document.getElementById('towersList');
            const capacities = currentLevel.towerCapacities || [];
            
            if (capacities.length === 0) {
                container.innerHTML = '<div class="text-gray-500 text-sm">Aucune tour</div>';
                return;
            }

            container.innerHTML = capacities.map(capacity => `
                <div class="p-2 bg-green-50 rounded border border-green-200 flex justify-between items-center group hover:bg-green-100 transition-colors">
                    <div class="flex-1">
                        <span class="text-sm font-medium">${capacity.towerTypeId}</span>
                        <span class="text-xs text-gray-600 ml-2">
                            (max niveau ${capacity.maxRank})
                        </span>
                    </div>
                    <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="editTowerCapacity('${capacity.towerTypeId}', ${capacity.maxRank})" 
                                class="text-blue-500 hover:text-blue-700 text-xs">
                            ✏️
                        </button>
                        <button onclick="removeTower('${capacity.towerTypeId}')" 
                                class="text-red-500 hover:text-red-700 text-xs">
                            🗑️
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function editTowerCapacity(towerTypeId, currentMaxRank) {
            document.getElementById('modalTitle').textContent = '✏️ Modifier le rang max';
            document.getElementById('modalContent').innerHTML = `
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">
                            Rang maximum pour ${towerTypeId}
                        </label>
                        <input type="number" 
                            id="newMaxRank" 
                            min="1" 
                            value="${currentMaxRank}"
                            class="w-full border rounded px-3 py-2">
                    </div>
                </div>
            `;
            
            document.getElementById('modalConfirm').onclick = async () => {
                const newMaxRank = parseInt(document.getElementById('newMaxRank').value);
                
                try {
                    const response = await fetch(
                        `${API_URL}/levels/${levelId}/tower-types/${towerTypeId}`,
                        {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ maxRank: newMaxRank })
                        }
                    );

                    if (response.ok) {
                        closeModal();
                        showNotification('✅ Niveau max mis à jour !', 'success');
                        await loadLevel();
                    } else {
                        showNotification('❌ Erreur de mise à jour', 'error');
                    }
                } catch (error) {
                    showNotification('❌ Erreur de connexion', 'error');
                }
            };
            
            showModal();
        }

        // Suppression
        async function removePath(pathId) {
            if (!confirm(`Supprimer le chemin "${pathId}" ?`)) return;
            try {
                await fetch(`${API_URL}/levels/${levelId}/paths/${pathId}`, { method: 'DELETE' });
                showNotification('✅ Chemin supprimé', 'success');
                await loadLevel();
            } catch (error) {
                showNotification('❌ Erreur', 'error');
            }
        }

        async function removeAttack(attackId) {
            if (!confirm(`Supprimer l'attaque "${attackId}" ?`)) return;
            try {
                await fetch(`${API_URL}/levels/${levelId}/attacks/${attackId}`, { method: 'DELETE' });
                showNotification('✅ Attaque supprimée', 'success');
                await loadLevel();
            } catch (error) {
                showNotification('❌ Erreur', 'error');
            }
        }

        async function removeTower(towerTypeId) {
            try {
                await fetch(`${API_URL}/levels/${levelId}/tower-types/${towerTypeId}`, { method: 'DELETE' });
                showNotification('✅ Tour retirée', 'success');
                await loadLevel();
            } catch (error) {
                showNotification('❌ Erreur', 'error');
            }
        }

        // Gestion du modal
        function showModal() {
            document.getElementById('modalOverlay').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.add('hidden');
        }

        // Système de notifications
        function showNotification(message, type = 'info') {
            const colors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                info: 'bg-blue-500'
            };

            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 ${colors[type]} text-white px-6 py-3 rounded-lg shadow-lg z-50`;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => notification.remove(), 3000);
        }

        async function analyzeLevel() {
            try {
                const response = await fetch(`${API_URL}/levels/${levelId}/analyze`);
                const analysis = await response.json();
                
                // Afficher dans une modal
                showAnalysisModal(analysis);
            } catch (error) {
                showNotification('❌ Erreur d\'analyse', 'error');
            }
        }

        function showAnalysisModal(analysis) {
            document.getElementById('modalTitle').textContent = '🔍 Analyse du niveau';
            
            let html = `
                <div class="space-y-4">
                    <div class="text-center">
                        <div class="text-6xl font-bold ${getDifficultyColor(analysis.difficultyScore)}">
                            ${analysis.difficultyScore}/100
                        </div>
                        <div class="text-gray-600 mt-2">${getDifficultyLabel(analysis.difficultyScore)}</div>
                    </div>
                    
                    <div class="border-t pt-4">
                        <h4 class="font-semibold mb-2">📊 Métriques</h4>
                        <div class="grid grid-cols-2 gap-2">
                            ${analysis.metrics.map(m => `
                                <div class="bg-gray-50 p-2 rounded">
                                    <div class="text-sm text-gray-600">${m.name}</div>
                                    <div class="font-bold">${m.value.toFixed(1)} ${m.unit}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    
                    ${analysis.warnings.length > 0 ? `
                        <div class="border-t pt-4">
                            <h4 class="font-semibold mb-2">⚠️ Avertissements</h4>
                            ${analysis.warnings.map(w => `
                                <div class="p-2 rounded mb-2 ${getWarningBg(w.severity)}">
                                    <div class="font-medium">${w.category}</div>
                                    <div class="text-sm">${w.message}</div>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
            
            document.getElementById('modalContent').innerHTML = html;
            showModal();
        }

        function getDifficultyColor(score) {
            if (score < 30) return 'text-green-600';
            if (score < 60) return 'text-yellow-600';
            if (score < 80) return 'text-orange-600';
            return 'text-red-600';
        }

        function getDifficultyLabel(score) {
            if (score < 30) return 'Facile';
            if (score < 60) return 'Moyen';
            if (score < 80) return 'Difficile';
            return 'Très difficile';
        }

        function getWarningBg(severity) {
            switch(severity) {
                case 'INFO': return 'bg-blue-50 border border-blue-200';
                case 'WARNING': return 'bg-yellow-50 border border-yellow-200';
                case 'CRITICAL': return 'bg-red-50 border border-red-200';
            }
        }

        // Charger au démarrage
        if (levelId) {
            loadLevel();
        } else {
            alert('⚠️ Aucun niveau spécifié');
            window.location.href = 'levels.html';
        }
    </script>
</body>
</html>
