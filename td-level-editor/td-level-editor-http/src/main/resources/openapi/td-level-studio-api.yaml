openapi: 3.0.3
info:
  title: Tower Defense Level Studio API
  description: |
    API complète pour l'éditeur de niveaux Tower Defense.
    
    Cette API permet de :
    - Créer et éditer des niveaux
    - Gérer les types d'ennemis
    - Gérer les types de tours
    - Importer/exporter en format draft (éditable) ou exportable (pour le moteur)
  version: 2.0.0
  contact:
    name: Tower Defense Studio Team

servers:
  - url: http://localhost:8081
    description: Serveur de développement local

tags:
  - name: Levels
    description: Gestion des niveaux
  - name: Level Editing
    description: Édition d'un niveau spécifique
  - name: Enemies
    description: Gestion des types d'ennemis
  - name: Towers
    description: Gestion des types de tours
  - name: Tower Editing
    description: Édition d'un type de tour spécifique
  - name: Level Analysis
    description: Analyse de faisabilité et de difficulté des niveaux

paths:
  # ========================================================================
  # LEVELS COLLECTION
  # ========================================================================
  
  /api/levels:
    get:
      summary: Liste tous les niveaux en cours d'édition
      tags: [Levels]
      operationId: getAllLevels
      responses:
        '200':
          description: Liste des niveaux
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EditableLevel'
    
    post:
      summary: Crée un nouveau niveau vide
      tags: [Levels]
      operationId: createLevel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLevelRequest'
      responses:
        '201':
          description: Niveau créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditableLevel'
        '400':
          description: Paramètres invalides

  /api/levels/{levelId}:
    get:
      summary: Récupère un niveau par son ID
      tags: [Levels]
      operationId: getLevel
      parameters:
        - name: levelId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Détails du niveau
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditableLevel'
        '404':
          description: Niveau non trouvé
    
    delete:
      summary: Supprime un niveau
      tags: [Levels]
      operationId: deleteLevel
      parameters:
        - name: levelId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Niveau supprimé avec succès

  /api/levels/import/draft:
    post:
      summary: Importe un niveau depuis un fichier draft (JSON éditable)
      tags: [Levels]
      operationId: importDraftLevel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '201':
          description: Niveau importé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditableLevel'

  /api/levels/import/exportable:
    post:
      summary: Importe un niveau depuis un fichier exportable (format moteur)
      tags: [Levels]
      operationId: importExportableLevel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '201':
          description: Niveau importé avec succès

  /api/levels/{levelId}/export/draft:
    post:
      summary: Exporte un niveau au format draft
      tags: [Levels]
      operationId: exportDraftLevel
      parameters:
        - name: levelId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '200':
          description: Niveau exporté avec succès

  /api/levels/{levelId}/export/exportable:
    post:
      summary: Exporte un niveau au format exportable (pour le moteur)
      tags: [Levels]
      operationId: exportExportableLevel
      parameters:
        - name: levelId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '200':
          description: Niveau exporté avec succès

  # ========================================================================
  # LEVEL EDITING
  # ========================================================================

  /api/levels/{levelId}/metadata:
    patch:
      summary: Met à jour les métadonnées d'un niveau
      tags: [Level Editing]
      operationId: updateLevelMetadata
      parameters:
        - name: levelId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LevelMetadataUpdate'
      responses:
        '200':
          description: Métadonnées mises à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditableLevel'

  /api/levels/{levelId}/paths:
    get:
      summary: Liste tous les chemins d'un niveau
      tags: [Level Editing]
      operationId: getLevelPaths
      parameters:
        - name: levelId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Liste des chemins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EditablePath'
    
    post:
      summary: Ajoute un nouveau chemin au niveau
      tags: [Level Editing]
      operationId: addPath
      parameters:
        - name: levelId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditablePath'
      responses:
        '201':
          description: Chemin ajouté

  /api/levels/{levelId}/paths/{pathId}:
    delete:
      summary: Supprime un chemin du niveau
      tags: [Level Editing]
      operationId: removePath
      parameters:
        - name: levelId
          in: path
          required: true
          schema:
            type: string
        - name: pathId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Chemin supprimé

  /api/levels/{levelId}/attacks:
    get:
      summary: Liste toutes les attaques d'un niveau
      tags: [Level Editing]
      operationId: getLevelAttacks
      parameters:
        - name: levelId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Liste des attaques
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EditableAttack'
    
    post:
      summary: Ajoute une nouvelle attaque au niveau
      tags: [Level Editing]
      operationId: addAttack
      parameters:
        - name: levelId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttackRequest'
      responses:
        '201':
          description: Attaque ajoutée

  /api/levels/{levelId}/attacks/{attackId}:
    delete:
      summary: Supprime une attaque du niveau
      tags: [Level Editing]
      operationId: removeAttack
      parameters:
        - name: levelId
          in: path
          required: true
          schema:
            type: string
        - name: attackId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Attaque supprimée

  /api/levels/{levelId}/attacks/{attackId}/waves:
    post:
      summary: Ajoute une vague à une attaque
      tags: [Level Editing]
      operationId: addWave
      parameters:
        - name: levelId
          in: path
          required: true
          schema:
            type: string
        - name: attackId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditableWave'
      responses:
        '201':
          description: Vague ajoutée

  /api/levels/{levelId}/attacks/{attackId}/waves/{waveId}:
    delete:
      summary: Supprime une vague d'une attaque
      tags: [Level Editing]
      operationId: removeWave
      parameters:
        - name: levelId
          in: path
          required: true
          schema:
            type: string
        - name: attackId
          in: path
          required: true
          schema:
            type: string
        - name: waveId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Vague supprimée

  /api/levels/{levelId}/tower-types:
    post:
      summary: Ajoute un type de tour avec rang max
      tags: [Level Editing]
      operationId: addTowerTypeToLevel
      parameters:
        - name: levelId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: 
                - towerTypeId
                - maxRank
              properties:
                towerTypeId:
                  type: string
                maxRank:
                  type: integer
                  minimum: 1
      responses:
        '204':
          description: Type de tour ajouté

  /api/levels/{levelId}/tower-types/{towerTypeId}:
    patch:
      summary: Met à jour le rang max d'un type de tour
      tags: [Level Editing]
      operationId: updateTowerCapacity
      parameters:
        - name: levelId
          in: path
          required: true
          schema:
            type: string
        - name: towerTypeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - maxRank
              properties:
                maxRank:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Rang max mis à jour
    
    delete:
      summary: Retire un type de tour du niveau
      tags: [Level Editing]
      operationId: removeTowerTypeFromLevel
      parameters:
        - name: levelId
          in: path
          required: true
          schema:
            type: string
        - name: towerTypeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Type de tour retiré

  # ========================================================================
  # ENEMIES COLLECTION
  # ========================================================================

  /api/enemies:
    get:
      summary: Liste tous les types d'ennemis
      tags: [Enemies]
      operationId: getAllEnemyTypes
      responses:
        '200':
          description: Liste des types d'ennemis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EditableEnemyType'
    
    post:
      summary: Crée un nouveau type d'ennemi
      tags: [Enemies]
      operationId: createEnemyType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnemyTypeRequest'
      responses:
        '201':
          description: Type d'ennemi créé

  /api/enemies/{enemyTypeId}:
    get:
      summary: Récupère un type d'ennemi par son ID
      tags: [Enemies]
      operationId: getEnemyType
      parameters:
        - name: enemyTypeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Détails du type d'ennemi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditableEnemyType'
    
    delete:
      summary: Supprime un type d'ennemi
      tags: [Enemies]
      operationId: deleteEnemyType
      parameters:
        - name: enemyTypeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Type d'ennemi supprimé

  /api/enemies/import/draft:
    post:
      summary: Importe un type d'ennemi depuis un fichier draft
      tags: [Enemies]
      operationId: importDraftEnemyType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '201':
          description: Type d'ennemi importé

  /api/enemies/import/exportable:
    post:
      summary: Importe un type d'ennemi depuis un fichier exportable
      tags: [Enemies]
      operationId: importExportableEnemyType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '201':
          description: Type d'ennemi importé

  /api/enemies/{enemyTypeId}/export/draft:
    post:
      summary: Exporte un type d'ennemi au format draft
      tags: [Enemies]
      operationId: exportDraftEnemyType
      parameters:
        - name: enemyTypeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '200':
          description: Type d'ennemi exporté

  /api/enemies/{enemyTypeId}/export/exportable:
    post:
      summary: Exporte un type d'ennemi au format exportable
      tags: [Enemies]
      operationId: exportExportableEnemyType
      parameters:
        - name: enemyTypeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '200':
          description: Type d'ennemi exporté

  # ========================================================================
  # TOWERS COLLECTION
  # ========================================================================

  /api/towers:
    get:
      summary: Liste tous les types de tours
      tags: [Towers]
      operationId: getAllTowerTypes
      responses:
        '200':
          description: Liste des types de tours
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EditableTowerType'
    
    post:
      summary: Crée un nouveau type de tour
      tags: [Towers]
      operationId: createTowerType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTowerTypeRequest'
      responses:
        '201':
          description: Type de tour créé

  /api/towers/{towerTypeId}:
    get:
      summary: Récupère un type de tour par son ID
      tags: [Towers]
      operationId: getTowerType
      parameters:
        - name: towerTypeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Détails du type de tour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditableTowerType'
    
    delete:
      summary: Supprime un type de tour
      tags: [Towers]
      operationId: deleteTowerType
      parameters:
        - name: towerTypeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Type de tour supprimé

  /api/towers/import/draft:
    post:
      summary: Importe un type de tour depuis un fichier draft
      tags: [Towers]
      operationId: importDraftTowerType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '201':
          description: Type de tour importé

  /api/towers/import/exportable:
    post:
      summary: Importe un type de tour depuis un fichier exportable
      tags: [Towers]
      operationId: importExportableTowerType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '201':
          description: Type de tour importé

  /api/towers/{towerTypeId}/export/draft:
    post:
      summary: Exporte un type de tour au format draft
      tags: [Towers]
      operationId: exportDraftTowerType
      parameters:
        - name: towerTypeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '200':
          description: Type de tour exporté

  /api/towers/{towerTypeId}/export/exportable:
    post:
      summary: Exporte un type de tour en format exportable
      tags: [Towers]
      operationId: exportExportableTowerType
      parameters:
        - name: towerTypeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '200':
          description: Type de tour exporté

  # ========================================================================
  # TOWER EDITING
  # ========================================================================

  /api/towers/{towerTypeId}/ranks:
    post:
      summary: Ajoute un nouveau rang à un type de tour
      tags: [Tower Editing]
      operationId: addTowerRank
      parameters:
        - name: towerTypeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditableTowerRank'
      responses:
        '201':
          description: Rang de tour ajouté

  /api/towers/{towerTypeId}/ranks/{rank}:
    delete:
      summary: Supprime un rang d'un type de tour
      tags: [Tower Editing]
      operationId: removeTowerRank
      parameters:
        - name: towerTypeId
          in: path
          required: true
          schema:
            type: string
        - name: rank
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Rang de tour supprimé
  # ========================================================================
  # LEVEL ANALYZER
  # ========================================================================
  /api/levels/{levelId}/analyze:
    get:
      summary: Analyse la faisabilité et la difficulté du niveau
      tags: [Level Analysis]
      operationId: analyzeLevel
      parameters:
        - name: levelId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rapport d'analyse du niveau
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelAnalysisReport'
        '404':
          description: Niveau non trouvé
# ============================================================================
# SCHEMAS
# ============================================================================

components:
  schemas:
    # ========================================================================
    # REQUESTS
    # ========================================================================
    
    CreateLevelRequest:
      type: object
      required:
        - id
        - width
        - height
      properties:
        id:
          type: string
        width:
          type: integer
          minimum: 5
          maximum: 50
        height:
          type: integer
          minimum: 5
          maximum: 50

    ImportRequest:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          description: Chemin du fichier à importer

    ExportRequest:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          description: Chemin où sauvegarder le fichier

    LevelMetadataUpdate:
      type: object
      properties:
        startingMoney:
          type: integer
          minimum: 0
        startingLives:
          type: integer
          minimum: 1

    CreateAttackRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string

    CreateEnemyTypeRequest:
      type: object
      required:
        - id
        - health
        - speed
        - reward
      properties:
        id:
          type: string
        health:
          type: integer
          minimum: 1
        speed:
          type: number
          format: double
          minimum: 0.01
        reward:
          type: integer
          minimum: 0

    CreateTowerTypeRequest:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string

    # ========================================================================
    # DOMAIN MODELS
    # ========================================================================
    
    EditableLevel:
      type: object
      required:
        - id
        - startingMoney
        - startingLives
        - map
        - paths
        - attacks
        - towerCapacities
      properties:
        id:
          type: string
        startingMoney:
          type: integer
        startingLives:
          type: integer
        map:
          $ref: '#/components/schemas/EditableMap'
        paths:
          type: array
          items:
            $ref: '#/components/schemas/EditablePath'
        attacks:
          type: array
          items:
            $ref: '#/components/schemas/EditableAttack'
        towerCapacities:
          type: array
          items:
            $ref: '#/components/schemas/TowerCapacity'
            
    TowerCapacity:
      type: object
      required:
        - towerTypeId
        - maxRank
      properties:
        towerTypeId:
          type: string
          example: "archer"
        maxRank:
          type: integer
          minimum: 1
          example: 2

    LevelMetadata:
      type: object
      required:
        - id
        - startingMoney
        - startingLives
      properties:
        id:
          type: string
        startingMoney:
          type: integer
          minimum: 0
        startingLives:
          type: integer
          minimum: 1

    EditableMap:
      type: object
      required:
        - width
        - height
        - paths
      properties:
        width:
          type: integer
        height:
          type: integer
        paths:
          type: array
          items:
            $ref: '#/components/schemas/EditablePath'

    EditablePath:
      type: object
      required:
        - id
        - points
      properties:
        id:
          type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/PositionDefinition'
          minItems: 2

    PositionDefinition:
      type: object
      required:
        - x
        - y
      properties:
        x:
          type: integer
        y:
          type: integer

    EditableAttack:
      type: object
      required:
        - id
        - waves
      properties:
        id:
          type: string
        waves:
          type: array
          items:
            $ref: '#/components/schemas/EditableWave'

    EditableWave:
      type: object
      required:
        - id
        - startTick
        - spawnInterval
        - count
        - enemyType
        - pathId
      properties:
        id:
          type: string
        startTick:
          type: integer
          minimum: 0
        spawnInterval:
          type: integer
          minimum: 1
        count:
          type: integer
          minimum: 1
        enemyType:
          type: string
        pathId:
          type: string

    EditableEnemyType:
      type: object
      required:
        - id
        - health
        - speed
        - reward
      properties:
        id:
          type: string
        health:
          type: integer
          minimum: 1
        speed:
          type: number
          format: double
          minimum: 0.01
        reward:
          type: integer
          minimum: 0

    EditableTowerType:
      type: object
      required:
        - id
        - towerType
        - ranks
      properties:
        id:
          type: string
        towerType:
          type: string
        ranks:
          type: array
          items:
            $ref: '#/components/schemas/EditableTowerRank'

    EditableTowerRank:
      type: object
      required:
        - rank
        - cost
        - range
        - damage
        - reloadTime
        - sellReward
        - buildTimeTicks
      properties:
        rank:
          type: integer
        cost:
          type: integer
        range:
          type: number
          format: double
        damage:
          type: integer
        reloadTime:
          type: number
          format: double
        sellReward:
          type: integer
        buildTimeTicks:
          type: integer

    LevelAnalysisReport:
      type: object
      required:
        - difficultyScore
        - warnings
        - metrics
      properties:
        difficultyScore:
          type: integer
          minimum: 0
          maximum: 100
          description: Score de difficulté global (0=facile, 100=impossible)
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisWarning'
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisMetric'
    AnalysisWarning:
      type: object
      required:
        - category
        - message
        - severity
      properties:
        category:
          type: string
          example: "Economy"
        message:
          type: string
          example: "Starting money is very low"
        severity:
          type: string
          enum: [INFO, WARNING, CRITICAL]
    AnalysisMetric:
      type: object
      required:
        - name
        - value
        - unit
      properties:
        name:
          type: string
          example: "Economy Score"
        value:
          type: number
          format: double
          example: 75.5
        unit:
          type: string
          example: "points"